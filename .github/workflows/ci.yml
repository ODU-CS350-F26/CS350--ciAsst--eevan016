on:
  push:
    branches: [ main ]
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build and test
        working-directory: ../CS350--ciAsst--eevan016
        timeout-minutes: 20
        run: ./gradlew test
      - name: Generate and publish report
        working-directory: ../CS350--ciAsst--eevan016
        timeout-minutes: 20
        run: ./gradlew deployReports